<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" role="img" aria-label="kaeru333's GitHub Stats: rank B">
  <!-- 統計カード (静的版)．更新日: 2026-09-15．github-readme-stats の calculateRank と同じ式でランクを算出 -->
  <rect width="495" height="195" rx="4.5" fill="#1a1b27"/>
  <text x="25" y="38" font-size="18" font-weight="600" fill="#70a5fd">kaeru333's GitHub Stats</text>
  <g font-size="14" fill="#38bdae">
    <g transform="translate(25 66)">
      <text fill="#bf91f3" font-weight="700">★</text>
      <text x="24" font-weight="600">Total Stars Earned:</text>
      <text x="220" font-weight="700">1</text>
    </g>
    <g transform="translate(25 91)">
      <text fill="#bf91f3" font-weight="700">⏱</text>
      <text x="24" font-weight="600">Total Commits:</text>
      <text x="220" font-weight="700">680</text>
    </g>
    <g transform="translate(25 116)">
      <text fill="#bf91f3" font-weight="700">⇄</text>
      <text x="24" font-weight="600">Total PRs:</text>
      <text x="220" font-weight="700">120</text>
    </g>
    <g transform="translate(25 141)">
      <text fill="#bf91f3" font-weight="700">◎</text>
      <text x="24" font-weight="600">Total Issues:</text>
      <text x="220" font-weight="700">147</text>
    </g>
    <g transform="translate(25 166)">
      <text fill="#bf91f3" font-weight="700">▣</text>
      <text x="24" font-weight="600">Contributed to:</text>
      <text x="220" font-weight="700">17</text>
    </g>
