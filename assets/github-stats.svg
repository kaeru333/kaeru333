  <!-- ランクの輪．percentile 59.7 -> 進捗 40.3% -->
  <g transform="translate(400 100)">
    <circle r="40" fill="none" stroke="#70a5fd" stroke-opacity="0.2" stroke-width="6"/>
    <circle r="40" fill="none" stroke="#70a5fd" stroke-width="6" stroke-linecap="round"
            stroke-dasharray="251.3" stroke-dashoffset="150.0" transform="rotate(-90)"/>
    <text text-anchor="middle" dominant-baseline="central" font-size="26" font-weight="800" fill="#38bdae">B</text>
  </g>
  <text x="400" y="165" text-anchor="middle" font-size="11" fill="#38bdae" opacity="0.8">rank (top ~60%)</text>
